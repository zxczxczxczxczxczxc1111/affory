# Б8 аудита 1.6.1: обновления зависимостей приходят запросами на слияние, а не
# узнаются при сборке выпуска.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /cmd/affory-ui/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
